    <script>
      // Automatic stale bundle recovery script
      window.addEventListener('error', function (e) {
        if (e.message && (e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('Importing binding') !== -1)) {
          console.warn('[CacheRecovery] Stale script bundle detected. Unregistering SW and reloading...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              for (var reg of registrations) {
                reg.unregister();
              }
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.update();
          }).catch(err => {
            console.log('Service Worker registration skipped:', err);
          });
        });
      }
    </script>
